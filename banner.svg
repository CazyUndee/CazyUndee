<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CazyUndee">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>

```
<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#6b2323" stop-opacity="0"/>
  <stop offset="50%" stop-color="#c97a7a" stop-opacity="0.8"/>
  <stop offset="100%" stop-color="#6b2323" stop-opacity="0"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M 40 0 L 0 0 0 40" fill="none"
        stroke="#ffffff" stroke-opacity="0.025"/>
</pattern>
```

